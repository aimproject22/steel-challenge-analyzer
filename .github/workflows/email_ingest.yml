name: Steel Challenge Gmail ingestion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry messages previously recorded as failed
        required: false
        type: boolean
        default: false
      reprocess_run_ids:
        description: Existing Run IDs whose source Gmail messages must be reprocessed (comma-separated)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: steel-challenge-email-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ingest new Gmail messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_TARGET_ADDRESS: ${{ secrets.GMAIL_TARGET_ADDRESS }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          REPROCESS_RUN_IDS: ${{ inputs.reprocess_run_ids }}
        shell: bash
        run: |
          args=(--max-results 100)
          if [[ "$RETRY_FAILED" == "true" ]]; then
            args+=(--retry-failed)
          fi
          if [[ -n "$REPROCESS_RUN_IDS" ]]; then
            args+=(--reprocess-run-ids "$REPROCESS_RUN_IDS")
          fi
          python email_ingest.py "${args[@]}"
